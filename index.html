<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
body{margin:0}[hidden]{display:none!important}img{max-width:100%}
/* app mode: full screen, no fake phone frame */
body{padding:0!important;display:block!important}
.phone{max-width:none!important;max-height:none!important;border-radius:0!important;box-shadow:none!important;--sbh:0px!important}
.sb{display:none!important}
</style></head><body>
<title>Insta abed</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Grand+Hotel&display=swap">
<style>
/* Layout: classic social-app structure with iOS liquid-glass chrome (floating glass tab bar, glass bars and sheets)
   over soft colour glows. Single committed dark look, so no light theme blocks. */
:root{
  --stage:#0b0b0b; --bg:#000; --surface:#121212; --surface-2:#262626; --line:#262626;
  --fg:#f5f5f5; --muted:#a8a8a8; --accent:#0a84ff; --brand:#ff7a3d; --like:#ff3040; --good:#34c759; --danger:#ff453a;
  --grad:linear-gradient(135deg,#ffb347,#ff5a36);
  --ring:linear-gradient(45deg,#ffb347,#ff5a36 45%,#c13584);
  --bgfx:radial-gradient(120% 55% at 100% 0%,rgba(255,122,61,.22),transparent 58%),radial-gradient(90% 50% at 0% 55%,rgba(193,53,132,.20),transparent 62%),radial-gradient(100% 50% at 85% 100%,rgba(70,90,255,.18),transparent 62%),#000;
  --glass:rgba(255,255,255,.09); --glass-line:rgba(255,255,255,.16);
  --shine:inset 0 1px 0 rgba(255,255,255,.42),inset 0 -1px 0 rgba(255,255,255,.08),inset 1px 0 0 rgba(255,255,255,.12),inset -1px 0 0 rgba(255,255,255,.12);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Inter,"IBM Plex Sans Arabic","Segoe UI","Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--stage);color:var(--fg);font-family:var(--font);font-size:15px;display:flex;justify-content:center;align-items:center;letter-spacing:-.005em}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;transition:transform .18s cubic-bezier(.3,1.6,.5,1)}
button:active{transform:scale(.94)}
input,textarea{font:inherit;color:var(--fg)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:24px;height:24px;display:block}
/* liquid glass */
.tb,.pn,.toast,.ibtn.g,.btn.ghost,.btn.on,.pill,.chips span,.bub.th,.cf input,.cf textarea,.search,.pn textarea,.fl input{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8);border:1px solid var(--glass-line);box-shadow:var(--shine),0 8px 24px rgba(0,0,0,.28)}
@supports not ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){.tb,.pn,.toast,.ibtn.g,.btn.ghost,.btn.on,.pill,.chips span,.bub.th,.cf input,.cf textarea,.search,.pn textarea,.fl input{background:rgba(44,44,48,.94)}}
.shine{isolation:isolate}
.shine::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,rgba(255,255,255,.28),rgba(255,255,255,0) 34%,rgba(255,255,255,0) 66%,rgba(255,255,255,.12));pointer-events:none;z-index:-1}
.glass-bar{background:rgba(0,0,0,.3);-webkit-backdrop-filter:blur(24px) saturate(1.8);backdrop-filter:blur(24px) saturate(1.8);border-bottom:1px solid rgba(255,255,255,.08)}
.phone{--sbh:0px;position:relative;width:100%;max-width:390px;height:100%;max-height:844px;background:var(--bgfx);border-radius:44px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.12),0 30px 80px rgba(0,0,0,.8);display:flex;flex-direction:column;min-width:0}
@media(max-width:480px){.phone{border-radius:28px}}
.sb{display:none;direction:ltr;height:48px;flex:none;align-items:center;justify-content:space-between;padding:6px 30px 0;font-weight:600;font-size:15px;position:relative;z-index:100}
.sb .isl{position:absolute;left:50%;top:10px;width:110px;height:30px;border-radius:20px;background:#000;transform:translateX(-50%);box-shadow:0 0 0 1px #1a1a1a}
@media(min-width:481px){.sb{display:flex}.phone{--sbh:48px}}
.screens{position:relative;flex:1;min-height:0}
.screen{position:absolute;inset:0;overflow-y:auto;display:none;scrollbar-width:none;padding-bottom:104px}
.screen.on{display:block}
.screen::-webkit-scrollbar{display:none}
.ibtn{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;flex:none;position:relative}
.ibtn .ic{width:24px;height:24px}
.ibtn.g{width:38px;height:38px}
.ibtn.g .ic{width:21px;height:21px}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:7px 14px 7px 12px;height:56px}
.wm{font-family:"Grand Hotel","Brush Script MT",cursive;font-size:33px;line-height:1;letter-spacing:.3px;padding-top:4px}
.tr{display:flex;gap:8px}
.nb{position:absolute;top:-3px;inset-inline-start:-3px;min-width:17px;height:17px;border-radius:9px;background:var(--like);color:#fff;font-size:10px;font-weight:700;font-style:normal;display:none;place-items:center;padding:0 4px;box-shadow:0 2px 6px rgba(255,48,64,.5)}
.nb.on{display:grid}
/* floating tab bar */
.tb{position:absolute;inset-inline:16px;bottom:14px;height:64px;border-radius:34px;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:0 5px}
.tb .ind{position:absolute;top:6px;bottom:6px;left:0;width:60px;border-radius:28px;background:rgba(255,255,255,.17);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(255,255,255,.1),0 4px 14px rgba(0,0,0,.3);transition:transform .6s cubic-bezier(.34,1.5,.5,1),width .3s;z-index:0}
.tb button{position:relative;z-index:1;display:grid;place-items:center;height:100%;color:var(--fg);opacity:.66}
.tb button.on{opacity:1}
.tb button.on .ic{stroke-width:2.4}
.tb .ic{width:26px;height:26px}
.tb .av{border:2px solid transparent}
.tb button.on .av{border-color:var(--fg)}
/* stories */
.stories{display:flex;gap:12px;overflow-x:auto;padding:12px 14px 14px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.st{display:grid;justify-items:center;gap:5px;font-size:12px;color:var(--fg);flex:none;width:68px}
.st span.nm{max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ring{padding:2.5px;border-radius:50%;background:var(--ring);display:block;position:relative}
.ring.seen{background:rgba(255,255,255,.22)}
.ring .av{border:2.5px solid #000}
.ring.own{background:none}
.plusb{position:absolute;bottom:0;inset-inline-end:0;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;border:2px solid #000;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:15px;line-height:1}
.av{width:var(--s,44px);height:var(--s,44px);border-radius:50%;display:grid;place-items:center;font-weight:700;color:#2a1a12;font-size:calc(var(--s,44px)*.42);flex:none}
/* posts */
.post{padding-bottom:16px}
.ph{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 4px;padding-inline-start:14px}
.ph b{font-size:14px}
.ph small{display:block;color:var(--muted);font-size:11.5px;margin-top:1px}
.ph .sp{flex:1}
.media{position:relative;aspect-ratio:1/1;display:grid;place-items:center;overflow:hidden;user-select:none;cursor:pointer;margin:0 10px;border-radius:26px;box-shadow:0 12px 30px rgba(0,0,0,.4),inset 0 0 0 1px rgba(255,255,255,.12)}
.media::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 28% 18%,rgba(255,255,255,.28),transparent 52%);pointer-events:none}
.big{font-size:120px;line-height:1;filter:drop-shadow(0 12px 24px rgba(0,0,0,.35))}
.pop{position:absolute;inset:0;z-index:2;display:grid;place-items:center;pointer-events:none;color:#fff;opacity:0}
.pop .ic{width:96px;height:96px}
.pop.go{animation:pop .7s ease}
@keyframes pop{0%{opacity:0;transform:scale(.4)}25%{opacity:1;transform:scale(1.15)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.1)}}
.acts{display:flex;align-items:center;gap:4px;padding:8px 10px 0}
.acts .sp{flex:1}
.acts button{display:flex;align-items:center;gap:6px;padding:6px}
.acts button.on{color:var(--like)}
.acts button.on2{color:var(--fg)}
.acts button.on3{color:var(--good)}
.rpb{display:flex;align-items:center;gap:6px;padding:8px 16px 0;color:var(--muted);font-size:12.5px}
.rpb .ic{width:16px;height:16px}
.acts .ic{width:26px;height:26px}
.lk{margin:2px 16px 0;font-weight:600;font-size:14px}
.cap{margin:4px 16px 0;font-size:14px;line-height:1.6}
.vc{display:block;margin:4px 16px 0;color:var(--muted);font-size:13.5px}
.tm{display:block;margin:4px 16px 0;color:var(--muted);font-size:11.5px}
.empty{color:var(--muted);text-align:center;padding:40px 24px;line-height:1.7}
/* reels */
#s-reels{padding-bottom:0}
.rt{position:absolute;top:0;inset-inline:0;z-index:5;padding:12px 16px;font-size:20px;font-weight:700;background:linear-gradient(rgba(0,0,0,.55),transparent);height:60px}
.reels{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}
.reels::-webkit-scrollbar{display:none}
.reel{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden}
.reel::before{content:"";position:absolute;inset:0;background:linear-gradient(transparent 50%,rgba(0,0,0,.7))}
.rbig{position:absolute;top:36%;left:50%;font-size:130px;transform:translate(-50%,-50%);animation:float 4s ease-in-out infinite;filter:drop-shadow(0 16px 30px rgba(0,0,0,.4))}
@keyframes float{50%{transform:translate(-50%,-56%)}}
.rside{position:absolute;inset-inline-end:10px;bottom:104px;display:grid;gap:16px;justify-items:center;z-index:2;padding:14px 8px;border-radius:32px;background:rgba(255,255,255,.12);-webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8);border:1px solid var(--glass-line);box-shadow:var(--shine),0 8px 24px rgba(0,0,0,.3)}
.rside button{display:grid;justify-items:center;gap:3px;font-size:12px;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.rside button.on{color:var(--like)}
.rside button.on2{color:#fff}
.rside button.on3{color:var(--good)}
.rside .ic{width:28px;height:28px}
.rinfo{position:absolute;inset-inline:16px 70px;bottom:100px;z-index:2;display:grid;gap:8px}
.rinfo p{margin:0;line-height:1.55;font-size:14px}
.rinfo small{opacity:.85}
.who{display:flex;align-items:center;gap:8px}
.fol{padding:4px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.7);font-size:12px;font-weight:600}
.fol.on{background:rgba(255,255,255,.2);border-color:transparent}
/* lists */
.pill{font-size:12px;padding:6px 11px;border-radius:14px;color:var(--muted)}
.pill.live{color:var(--good)}
.srch{padding:8px 14px;position:sticky;top:0;z-index:4}
.search{display:flex;align-items:center;gap:8px;border-radius:16px;padding:0 12px}
.search .ic{width:18px;height:18px;color:var(--muted)}
.search input{flex:1;min-width:0;background:none;border:0;padding:10px 0;outline:none}
.crow{display:flex;align-items:center;gap:12px;width:100%;padding:9px 16px;text-align:start}
.crow .mid{flex:1;min-width:0}
.crow b{display:block;font-size:14.5px}
.crow small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow.un small{color:var(--fg);font-weight:600}
.crow .end{display:grid;justify-items:end;gap:6px;color:var(--muted);font-size:12px}
.badge{min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;font-size:12px;display:grid;place-items:center;padding:0 6px}
.avw{position:relative;display:block}
.dot{position:absolute;bottom:1px;inset-inline-end:1px;width:13px;height:13px;border-radius:50%;background:var(--good);border:2.5px solid #000}
.btn{padding:8px 16px;border-radius:14px;background:var(--accent);color:#fff;font-weight:600;font-size:14px}
.btn.ghost,.btn.on{color:var(--fg)}
.btn.full{width:100%;padding:13px;font-size:15px}
.btn.grow{flex:1}
/* overlays */
.ov{position:absolute;inset:var(--sbh) 0 0 0;background:var(--bgfx);z-index:40;display:none;flex-direction:column;min-height:0}
.ov.on{display:flex;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.ovh{display:flex;align-items:center;gap:10px;padding:8px 10px;flex:none;position:relative;z-index:3}
.ovh h2{margin:0;font-size:17px;flex:1}
.ovh .ht{flex:1;min-width:0}
.ovh .ht b{display:block;font-size:15px}
.ovh .ht small{color:var(--muted);font-size:12px}
.ovh .ht small.ok{color:var(--good)}
.ovb{flex:1;overflow-y:auto;min-height:0;padding-bottom:30px}
.thread{flex:1;overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:6px;padding:14px 14px 8px}
.bub{max-width:78%;padding:9px 14px;border-radius:22px;font-size:14.5px;line-height:1.5;overflow-wrap:anywhere}
.bub.me{align-self:flex-start;background:var(--grad);color:#1a0d05;border-end-end-radius:7px;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 16px rgba(255,90,54,.25)}
.bub.th{align-self:flex-end;border-end-start-radius:7px}
.seen{align-self:flex-start;font-size:11px;color:var(--muted);padding:0 6px}
.note{align-self:center;font-size:12px;color:var(--muted);background:rgba(255,255,255,.06);padding:6px 12px;border-radius:12px;margin:6px 0}
.dots{align-self:flex-end;display:flex;gap:4px;background:rgba(255,255,255,.12);padding:13px 14px;border-radius:20px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bl 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bl{50%{opacity:.25;transform:translateY(-2px)}}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 14px 8px;scrollbar-width:none;flex:none}
.chips span{flex:none;font-size:11.5px;color:var(--muted);padding:5px 10px;border-radius:12px}
.cf{display:flex;gap:8px;align-items:center;padding:8px 12px 14px;flex:none}
.cf input,.cf textarea{flex:1;min-width:0;border-radius:24px;padding:12px 16px;outline:none}
.send{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 16px rgba(10,132,255,.4)}
.send .ic{width:20px;height:20px;transform:scaleX(-1)}
/* profile */
.ptop{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:6px 8px 6px 14px;height:56px}
.ptop b{font-size:19px}
.pmain{display:flex;align-items:center;gap:22px;padding:10px 16px 6px}
.pmain .ring{padding:3px}
.stats{flex:1;display:flex;justify-content:space-around;text-align:center}
.stats b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.stats small{color:var(--fg);font-size:12.5px}
.pname{padding:8px 16px 0}
.pname b{font-size:14.5px}
.pname p{margin:2px 0 0;font-size:14px;line-height:1.6}
.pbtns{display:flex;gap:8px;padding:12px 16px 4px}
.pbtns .btn{padding:10px 16px}
.hl{display:flex;gap:16px;overflow-x:auto;padding:12px 16px;scrollbar-width:none}
.hl button{display:grid;justify-items:center;gap:5px;font-size:12px;flex:none;width:64px}
.hl .c{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-size:26px;border:1.5px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06)}
.ptabs{display:flex;border-top:1px solid rgba(255,255,255,.1)}
.ptabs button{flex:1;display:grid;place-items:center;padding:11px;color:var(--muted);border-top:1.5px solid transparent;margin-top:-1px}
.ptabs button.on{color:var(--fg);border-color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.tile{aspect-ratio:1;display:grid;place-items:center;font-size:38px}
/* settings (list style) */
.srch2{padding:10px 16px 4px}
.acc{display:grid;gap:3px;text-align:start;margin:10px 16px 0;padding:14px 16px;border-radius:20px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);width:calc(100% - 32px)}
.acc b{font-size:15px}
.acc small{color:var(--muted);font-size:12.5px}
.gt{margin:20px 18px 4px;color:var(--muted);font-size:13px;font-weight:600}
.srow{display:flex;align-items:center;gap:14px;padding:13px 18px;width:100%;text-align:start}
.srow>.ic{width:24px;height:24px;flex:none}
.srow .sl{flex:1;min-width:0;font-size:15.5px}
.srow .val{color:var(--muted);font-size:14px}
.srow .chev .ic{width:16px;height:16px;transform:scaleX(-1);color:var(--muted)}
.srow.red{color:var(--accent)}
.srow.tg{padding-block:10px}
.sdesc{margin:4px 18px 0;color:var(--muted);font-size:12.5px;line-height:1.65}
.sw{width:51px;height:31px;border-radius:20px;background:rgba(255,255,255,.2);position:relative;transition:background .25s;flex:none}
.sw::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:inset-inline-start .3s cubic-bezier(.34,1.5,.5,1);box-shadow:0 2px 6px rgba(0,0,0,.35)}
.sw.on{background:var(--good)}
.sw.on::after{inset-inline-start:22px}
.about{display:grid;justify-items:center;gap:8px;padding:40px 20px 10px;color:var(--muted);font-size:13px;text-align:center;line-height:1.7}
.logo{width:88px;height:88px;border-radius:26px;background:var(--grad);display:grid;place-items:center;font:400 62px/1 "Grand Hotel","Brush Script MT",cursive;color:#1a0d05;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 12px 36px rgba(255,120,50,.35);padding-bottom:6px}
.logo.sm{width:60px;height:60px;border-radius:18px;font-size:42px}
.word{font:400 30px/1 "Grand Hotel","Brush Script MT",cursive;color:var(--fg)}
/* story */
.story{position:absolute;inset:0;z-index:60;background:#000;display:none}
.story.on{display:block}
.sbg{position:absolute;inset:0;display:grid;place-items:center;cursor:pointer}
.sbig{font-size:150px;filter:drop-shadow(0 16px 30px rgba(0,0,0,.35))}
.stxt{position:absolute;bottom:130px;inset-inline:24px;text-align:center;font-size:22px;font-weight:600;text-shadow:0 2px 12px rgba(0,0,0,.5);margin:0}
.sbars{position:absolute;top:calc(var(--sbh) + 8px);inset-inline:12px;display:flex;gap:4px;z-index:2}
.sbars span{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden}
.sbars i{display:block;height:100%;background:#fff;width:0}
.shead{position:absolute;top:calc(var(--sbh) + 20px);inset-inline:12px;display:flex;align-items:center;gap:10px;z-index:2;padding:6px 8px 6px 6px;border-radius:30px;background:rgba(255,255,255,.12);-webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8);border:1px solid var(--glass-line);box-shadow:var(--shine)}
.shead small{opacity:.8}
.sreply{position:absolute;bottom:0;inset-inline:0;display:flex;gap:8px;align-items:center;padding:12px 12px 22px;z-index:2}
.sreply input{flex:1;min-width:0;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);box-shadow:var(--shine);border-radius:24px;padding:12px 16px;outline:none;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.emo{font-size:22px}
/* sheet, toast, splash */
.sheet{position:absolute;inset:0;z-index:70;display:none}
.sheet.on{display:block}
.sheet .bd{position:absolute;inset:0;background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.pn{position:absolute;inset:auto 8px 8px 8px;max-height:84%;overflow:auto;background:rgba(40,40,46,.55);-webkit-backdrop-filter:blur(36px) saturate(1.9);backdrop-filter:blur(36px) saturate(1.9);border-radius:34px;padding:10px 18px 22px;animation:up .35s cubic-bezier(.34,1.3,.5,1)}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.pn::before{content:"";display:block;width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.35);margin:0 auto 14px;position:static;inset:auto;background-image:none}
.pn h3{margin:0 0 12px;font-size:17px}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:14px 4px;border-bottom:1px solid rgba(255,255,255,.1);text-align:start;font-size:15px}
.opt:last-child{border-bottom:0}
.opt.bad{color:var(--danger)}
.cl{display:grid;gap:12px;margin-bottom:12px;max-height:300px;overflow:auto}
.cm{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.55}
.cm b{margin-inline-end:6px}
.pn .cf{padding:0}
.scp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.sc{aspect-ratio:1;border-radius:18px;font-size:30px;display:grid;place-items:center;border:2px solid transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.sc.on{border-color:#fff}
.pn textarea{width:100%;border-radius:18px;padding:12px 14px;margin-bottom:12px;resize:none;outline:none}
.fl{display:grid;gap:6px;margin-bottom:12px;font-size:13px;color:var(--muted)}
.fl input{border-radius:14px;padding:12px 14px;outline:none;font-size:15px}
.toast{position:absolute;top:calc(var(--sbh) + 12px);left:50%;transform:translate(-50%,-14px);opacity:0;pointer-events:none;z-index:95;background:rgba(50,50,56,.6);padding:10px 18px;border-radius:22px;font-size:13.5px;max-width:86%;text-align:center;line-height:1.5;transition:.3s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.splash{position:absolute;inset:0;z-index:120;background:var(--bgfx);display:grid;place-content:center;justify-items:center;gap:14px;transition:opacity .5s .1s}
.splash.off{opacity:0;pointer-events:none}
.splash .logo{animation:pulse 1.2s ease}
@keyframes pulse{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function sendMsg(){

 gosaved(){ACT.closesettings();S.tab='profile';S.ptab='saved';renderProfile();show()},
 tog(t){const k=t.dataset.k;S.set[k]=!S.set[k];t.classList.toggle('on',S.set[k]);t.setAttribute('aria-checked',S.set[k]);save();renderInbox();if(S.chat)renderChat()},
 edit(){openEdit()},
 saveedit(){U.me.n=($('#en').value||'').trim()||U.me.n;U.me.bio=($('#eb').value||'').trim();save();closeSheet();renderProfile();renderStories();renderFeed();toast('انحفظت التعديلات')},
 ptab(t){S.ptab=t.dataset.v;renderProfile()},
 toast(t){toast(t.dataset.m)},
 closesheet:closeSheet
};
$('#phone').addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const f=ACT[t.dataset.act];if(f)f(t,t.dataset.id,e);
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if($('#sheet').classList.contains('on'))closeSheet();
  else if(ST)closeStory();
  else if($('#chat').classList.contains('on'))closeChat();
  else if($('#settings').classList.contains('on'))ACT.setback();
  else if($('#inbox').classList.contains('on'))ACT.closeinbox();
});
window.addEventListener('resize',moveInd);

/* boot */
load();
document.querySelectorAll('[data-ic]').forEach(el=>el.innerHTML=ic(el.dataset.ic));
renderStories();renderFeed();renderReels();renderSearch();renderInbox();renderProfile();updNb();show();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(moveInd);
setTimeout(moveInd,120);
setTimeout(()=>$('#splash').classList.add('off'),1300);
</script>
